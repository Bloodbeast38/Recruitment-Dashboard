
name: Sync Excel to Dashboard Data

on:
  push:
    paths:
      - '*.xlsx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install xlsx

      - name: Run Excel Processor
        run: node scripts/process-excel.js

      - name: Commit and Push data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update dashboard data.json from Excel sync'
          file_pattern: 'data.json'
          
